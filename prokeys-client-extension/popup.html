<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:280px;background:#111827;color:#f9fafb;font-family:'Segoe UI',sans-serif;font-size:13px}
.header{background:#1f2937;border-bottom:2px solid #ef4444;padding:12px 16px;display:flex;align-items:center;gap:10px}
.header h1{font-size:14px;font-weight:700;color:#ef4444}
.status{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#1f2937;margin:8px;border-radius:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#6b7280}
.dot.on{background:#10b981;box-shadow:0 0 6px #10b98166}
.body{padding:12px 16px}
.info{font-size:11px;color:#6b7280;text-align:center;line-height:1.6}
a{color:#ef4444;text-decoration:none}
</style>
</head>
<body>
<div class="header">
  <h1>🔑 Pro Keys</h1>
</div>
<div class="status">
  <div class="dot" id="dot"></div>
  <span id="statusText" style="font-size:12px;color:#9ca3af">جاري الفحص...</span>
</div>
<div class="body">
  <p class="info">
    افتح <a href="http://localhost:3000/u/dashboard" target="_blank">لوحة التحكم</a><br/>
    واختار السيرفر لتبدأ الاستخدام
  </p>
</div>
<script src="popup.js"></script>
</body>
</html>
